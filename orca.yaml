# Orca (https://github.com/stablyai/orca) cross-OS workspace recipe for sota-multi-model-workflows (v3.10.9)
# Supports Apple M5 Max (macOS), Stationary Noesis (Win32), and Noesis-Carbon (WSL2 ext4).
# Cross-OS invariant: commands run identically in Win32 PowerShell, macOS zsh, and Linux bash.
scripts:
  setup: |
    uv sync --locked
setupAgentStartupPolicy: wait-for-setup
defaultTabs:
  - title: Agent
  - title: Native SOTA Workflow & 60-Skill Enactor
    command: uv run python -m sota_mmw.native_workflow_enactor status --json
  - title: CC-Lead & Lanes Hub
    command: uv run python -m sota_mmw.dual_machine_lanes status --json
  - title: 21-Workflow Suite & Pytest
    command: uv run pytest -q
  - title: Tier-0 Merge Gate
    command: uv run python scripts/merge_gate.py
